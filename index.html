<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Куда пойти с Дашей</title>
<meta name="description" content="Детские спектакли, ёлки и цирк в Кирове для ребёнка 3–6 лет: ноябрь — январь.">
<meta property="og:title" content="Куда пойти с Дашей">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#FBF7F1;--card:#fff;--ink:#1F2033;--muted:#5F6272;--faint:#CFC9C0;--line:#EEE6DA;--accent:#E4572E;--soft:#FFF3EA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:1000px;margin:0 auto;padding:24px 18px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{font-size:28px;font-weight:900;margin:0;letter-spacing:-.02em}
.toggle{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap}
.sw{width:38px;height:22px;border-radius:999px;background:#E3DCD2;position:relative;transition:.2s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{color:var(--ink)}.toggle.on .sw{background:var(--accent)}.toggle.on .sw::after{left:19px}

/* desktop calendar */
.layout{display:grid;grid-template-columns:380px 1fr;gap:28px;align-items:start}
.side{position:sticky;top:20px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin:0 4px 12px}
.mhead b{font-size:20px;font-weight:900}
.arr{width:36px;height:36px;border-radius:11px;border:1px solid var(--line)!important;font-size:18px;font-weight:900}
.arr:disabled{opacity:.25;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:var(--faint);font-size:15px}
.day.has{background:var(--soft);color:var(--ink)}
.day.has:hover{background:#FFE5D6}
.day .dots{display:flex;gap:3px;margin-top:4px;height:6px}.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}.day .dots i.o{background:#E0A100}
.day.sel{background:var(--ink)!important;color:#fff}.day.sel .dots i{background:#fff}.day.sel .dots i.o{background:#FFC94D}
.legend{font-size:12.5px;color:var(--muted);font-weight:700;margin:12px 4px 0;line-height:1.5}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin:0 4px 1px 0}.legend i.o{background:#E0A100}

/* mobile strip */
.strip-wrap{display:none}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 14px 10px}
.cell{flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
.ml{height:15px;font-size:12px;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;padding-left:2px}
.strip::-webkit-scrollbar{display:none}
.chipd{flex:0 0 auto;scroll-snap-align:start;width:62px;border-radius:16px;background:var(--card);border:1px solid var(--line)!important;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px}
.chipd .w{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
.chipd .n{font-size:22px;font-weight:900;line-height:1.1}
.chipd .m{font-size:11px;font-weight:800;color:var(--accent)}
.chipd.sel{background:var(--ink);border-color:var(--ink)!important;color:#fff}.chipd.sel .w{color:#B9BBCC}.chipd.sel .m{color:#FFB59E}
.mon{flex:0 0 auto;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;padding:0 2px;align-self:center}

/* events */
.dh{margin:2px 0 14px}
.dh .w{font-size:13px;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.dh h2{margin:2px 0 0;font-size:28px;font-weight:900}
.ev{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px;display:grid;grid-template-columns:74px minmax(0,1fr);gap:16px}
.ev-l{border-right:1px solid var(--line);padding-right:12px}
.ev-time{font-size:22px;font-weight:900;line-height:1.15;letter-spacing:-.01em}
.slot+.slot{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.ev-end{font-size:13px;font-weight:700;color:var(--muted);margin-top:1px;white-space:nowrap}
.ev-dur{font-size:13px;font-weight:700;color:var(--muted);margin-top:8px;line-height:1.35}
.ev h3{margin:0 0 4px;font-size:18px;font-weight:900;line-height:1.25}
.desc{margin:0;font-size:15px;line-height:1.5;color:#4A4C5E}
.ev-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:#F4EFE8;color:var(--muted);white-space:nowrap}
.chip.six{background:#FCF1DC;color:#8A5600}
.buyrow{display:flex;align-items:center;gap:12px;margin-left:auto}
.price{font-size:15px;font-weight:900;white-space:nowrap}
.buy{display:inline-block;text-decoration:none;font-weight:800;font-size:14px;padding:9px 16px;border-radius:11px;border:1.5px solid var(--ink);color:var(--ink);background:#fff;white-space:nowrap}
.buy:hover{background:var(--ink);color:#fff}
.soldnote{font-size:13.5px;font-weight:700;color:var(--muted);padding:2px 4px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:20px;padding:22px;color:var(--muted);font-weight:700;line-height:1.5}
.src{color:var(--muted);font-size:12.5px;font-weight:600;line-height:1.55;margin-top:26px}

@media (max-width:820px){
  .wrap{padding:16px 0 48px}
  .top{padding:0 14px;margin-bottom:12px}
  h1{font-size:21px;white-space:nowrap}
  .toggle{font-size:13px;gap:6px}
  .tl-long{display:none}
  .layout{display:block}
  .side{position:static;margin:0 14px 18px;padding:12px}
  .day{border-radius:10px}
  .strip-wrap{display:block;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,rgba(251,247,241,0));padding-top:8px}
  #events{padding:6px 14px 0}
  .dh h2{font-size:24px}
  .ev{padding:14px;grid-template-columns:68px minmax(0,1fr);gap:12px}
  .slot+.slot{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.ev-end{font-size:13px;font-weight:700;color:var(--muted);margin-top:1px;white-space:nowrap}
.ev-dur{font-size:12px}
  .ev-l{padding-right:10px}
  .ev-time{font-size:19px}
  .src{padding:0 14px}
}
</style>
</head>

let sel=days()[0]||null;
let m=monthOf(sel);
function monthOf(k){if(!k)return 0;const d=toD(k);const i=MONTHS.findIndex(([y,mo])=>y===d.getFullYear()&&mo===d.getMonth());return i<0?0:i}

function renderGrid(){
  const [y,mo,name]=MONTHS[m];
  document.getElementById("mname").textContent=`${name} ${y}`;
  document.getElementById("prev").disabled=m===0;document.getElementById("next").disabled=m===MONTHS.length-1;
  const cnt={};avail().forEach(e=>{cnt[e.date]=cnt[e.date]||new Map();cnt[e.date].set(e.s.key+e.s.ny,e.s.age)});
  let g=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(d=>`<div class="dow">${d}</div>`).join("");
  const off=(new Date(y,mo,1).getDay()+6)%7;for(let i=0;i<off;i++)g+="<div></div>";
  for(let d=1;d<=new Date(y,mo+1,0).getDate();d++){
    const k=key(new Date(y,mo,d)),c=cnt[k]?cnt[k].size:0;
    g+=c?`<button class="day has ${k===sel?"sel":""}" data-k="${k}" aria-label="${d} ${MG[mo]}, ${c} ${pl(c,"спектакль","спектакля","спектаклей")}">${d}<span class="dots">${[...cnt[k].values()].sort().slice(0,4).map(a=>`<i class="${a==="6+"?"o":""}"></i>`).join("")}</span></button>`:`<div class="day">${d}</div>`;
  }
  const el=document.getElementById("grid");el.innerHTML=g;
  el.querySelectorAll(".day.has").forEach(b=>b.onclick=()=>pick(b.dataset.k));
}
function renderEvents(){
  const ev=document.getElementById("events");
  if(!sel){ev.innerHTML=`<div class="empty">Подходящих дат пока нет.</div>`;return}
  const d=toD(sel);
  const dayAll=ALL.filter(e=>e.date===sel&&fits(e));
  const g={};dayAll.filter(e=>!e.sold).forEach(e=>{(g[e.s.key+e.s.ny]=g[e.s.key+e.s.ny]||{s:e.s,times:[]}).times.push(e.time)});
  const items=Object.values(g).sort((a,b)=>a.times[0].localeCompare(b.times[0]));
  const soldN=dayAll.filter(e=>e.sold).length;
  ev.innerHTML=`<div class="dh"><div class="w">${DW[d.getDay()]}</div><h2>${d.getDate()} ${MG[d.getMonth()]}</h2></div>`+
   items.map(({s,times})=>{
     const place=esc(s.venue.split(",")[0].replace(" им. Афанасьева",""));
     const dur=s.dur?`${s.dur} мин${s.brk?`<br><span style="white-space:nowrap">+ антракт</span>`:""}`:"";
     const age=s.age==="6+"?`<span class="chip six">6+</span>`:"";
     const price=s.price?s.price.replace("≈ ","~"):"";
     return `<article class="ev"><div class="ev-l">${times.length>1?`<div class="ev-end" style="margin:0 0 2px">Начало</div>${times.map(t=>`<div class="ev-time">${t}</div>`).join("")}`:`<div class="ev-time">${times[0]}</div><div class="ev-end">${endOf(times[0],s)}</div>`}</div>
       <div><h3>${s.ny?"🎄 ":""}${esc(s.title)}</h3><p class="desc">${esc(s.d)}</p>
       <div class="ev-f"><div class="chips">${age}<span class="chip" title="${esc(s.venue)}">📍 ${place}</span></div>
       <div class="buyrow">${price&&price!=="цена на сайте"?`<span class="price">${price}</span>`:""}<a class="buy" href="${s.u}" target="_blank" rel="noopener">Билеты ↗</a></div></div></div></article>`}).join("")+
   (soldN?`<div class="soldnote">Ещё ${soldN} ${pl(soldN,"показ","показа","показов")} в этот день уже распродан${soldN>1?"ы":""}.</div>`:"");
}
function endOf(t,s){
  if(!s.dur)return `<span title="Площадка не указала длительность" style="opacity:.55">до —</span>`;
  const [h,m]=t.split(":").map(Number);const tot=h*60+m+s.dur+(typeof s.brk==="number"?s.brk:0);
  return "до "+(s.approx?"~":"")+Math.floor(tot/60)+":"+String(tot%60).padStart(2,"0");
}
function pick(k){sel=k;m=monthOf(k);render();if(innerWidth<=820){const h=document.querySelector(".dh");if(h&&h.getBoundingClientRect().top>innerHeight*0.75)h.scrollIntoView({behavior:"smooth"})}}
function render(){renderGrid();renderEvents();
  const t=document.getElementById("t6");t.classList.toggle("on",show6);t.setAttribute("aria-pressed",show6);
  document.getElementById("t6").onclick=()=>{show6=!show6;if(!days().includes(sel))sel=days()[0]||null;m=monthOf(sel);render()};}
document.getElementById("prev").onclick=()=>{m--;const [y,mo]=MONTHS[m];sel=days().find(k=>toD(k).getFullYear()===y&&toD(k).getMonth()===mo)||sel;render()};
document.getElementById("next").onclick=()=>{m++;const [y,mo]=MONTHS[m];sel=days().find(k=>toD(k).getFullYear()===y&&toD(k).getMonth()===mo)||sel;render()};
render();
</script>
</body>
</html>
